# Copy to .github/workflows/update.yml in your community repo.
name: Update collections

on:
  schedule:
    - cron: "0 0 * * *" # daily 00:00 UTC
  workflow_dispatch: # "Run workflow" on the Actions page
    inputs:
      full:
        description: Re-download everything from Zenodo
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    uses: rkrug/zenodo-openalex-collection/.github/workflows/collection.yml@v1
    with:
      title: My Community OpenAlex Collections
      full: ${{ inputs.full || false }}
    secrets:
      API_ZENODO_RO: ${{ secrets.API_ZENODO_RO }}
      API_OPENALEX_PERSONAL: ${{ secrets.API_OPENALEX_PERSONAL }}
