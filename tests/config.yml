# Small test range: a few dozen records, two months to check.
test:
  zenodo_community: ipbes
  collection_name: ZOC pipeline check
  from: 2026-10-01
  interval: month
  recheck: # rolling; tests keep no data, so every test run starts at the first week
    interval: week
    per_run: 2
  to: ~
  access: private
