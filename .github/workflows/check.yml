# Offline checks of the pipeline logic (tests/test_offline.R): no network calls to Zenodo or
# OpenAlex, no secrets. Required to pass before a pull request can be merged into main.
name: Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::targets
            any::tarchetypes
            any::yaml
            any::arrow
            any::dplyr
            any::jsonlite

      - name: Offline checks
        run: Rscript tests/test_offline.R
